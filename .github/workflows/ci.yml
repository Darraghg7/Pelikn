# Quality gates — lint + typecheck + unit tests on every PR and push to main.
# These checks were green on 31 July 2026; if this workflow fails, the change
# being merged broke them. Fix the change, don't skip the check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gates react-hooks/rules-of-hooks, which is an error. React #310 shipped
      # to production three times before this step existed. exhaustive-deps is a
      # warning and does not fail the build — see eslint.config.js.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit
