name: Daily Storage Backup

# Copies uploaded files (Supabase Storage: HR documents, training files, venue
# documents, photos, logos) to Cloudflare R2, encrypted file by file.
# Script: scripts/backup-storage.mjs. Restore steps: docs/restore-procedure.md.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC every day, after the 02:00 database backup
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: list and count what would be copied, upload nothing'
        type: boolean
        default: true

concurrency:
  group: storage-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script reads every secret from the environment and never prints
      # them or any file name (counts only). A failed run turns red and GitHub
      # emails the person who last edited this schedule.
      - name: Back up storage files
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          STORAGE_BACKUP_PASSPHRASE: ${{ secrets.STORAGE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/backup-storage.mjs --dry-run
          else
            node scripts/backup-storage.mjs
          fi
